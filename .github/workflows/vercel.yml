# main に push すると Vercel の本番（https://if-juku-corp.vercel.app/）へ公開する
# 公開用の VERCEL_TOKEN を渡すので、使う道具はすべて版を固定する
# （Actions はコミットの SHA、Vercel CLI は版の番号。上げるときはここを書き換える）
name: Vercel 本番公開
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: vercel-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npx --yes vercel@66.5.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
